<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>网页在线聊天室</title>
    <link rel="icon" href="favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <section id="join-panel" hidden>
        <h1 class="title-text">网页在线聊天室</h1>
        <form id="join-form" class="row">
            <input id="join-nick" placeholder="请输入你的昵称..." maxlength="16">
            <button>确认</button>
        </form>
    </section>

    <main id="chat" hidden>
        <header>
            <h1 class="title-text">
                网页在线聊天室(<span id="online-count">0</span>人在线)
            </h1>
            <nav id="menu">
                <a href="#" data-panel="nick">修改昵称</a>
                <a href="#" data-panel="online">在线列表</a>
                <a href="#" data-panel="about">关于</a>
            </nav>
        </header>

        <section id="nick-panel" data-panel-id="nick" hidden>
            <form id="nick-form" class="row">
                <input id="nick-input" placeholder="请输入你的新昵称..." maxlength="16">
                <button type="button" data-close>取消</button>
                <button>确认</button>
            </form>
        </section>

        <section id="online-panel" data-panel-id="online" hidden>
            <div id="online-list"></div>
            <button data-close>确认</button>
        </section>

        <section id="about-panel" data-panel-id="about" hidden>
            <h2 class="about-title">网页在线聊天室</h2>
            <p>作者：passerby.</p>
            <p>版本：V2026.10.04</p>
            <button data-close>确认</button>
        </section>

        <section id="box"></section>

        <form id="input-form">
            <span id="input-nick"></span>
            <input id="inp" placeholder="输入消息..." autocomplete="off" maxlength="100">
            <button>发送</button>
        </form>
    </main>

    <template id="tpl-msg">
        <article class="msg">
            <span class="nick"></span>
            <span class="meta time-mark"></span>
            <span class="id"></span><span class="meta">]:</span>
            <span class="text"></span>
        </article>
    </template>

    <template id="tpl-sys">
        <article class="msg system">
            <span class="sys label"></span>
            <span class="text"></span>
            <span class="sys id"></span>
        </article>
    </template>

    <div id="toast" hidden></div>

    <script src="script.js"></script>
</body>
</html>
